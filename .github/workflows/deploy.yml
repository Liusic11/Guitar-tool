# 自动部署到 GitHub Pages
# 推送到 main 分支时，自动构建（npm run build）并把 dist/ 发布到 GitHub Pages。
# 发布方式：GitHub Actions 源（不设 gh-pages 分支，由 actions/deploy-pages 直接发布）。
# 首次使用前，去仓库 Settings → Pages → Source 选「GitHub Actions」即可（本工作流会自动发布）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 关闭 Jekyll，避免 GitHub Pages 处理静态文件时误删/改资源
      - name: Disable Jekyll
        run: echo "" > dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
